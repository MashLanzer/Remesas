name: Build Android APK

# Genera un APK (contenedor de la web) cuando lo lances manualmente o al crear un tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Remesas.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: remesas-apk
          path: Remesas.apk
          if-no-files-found: error

      - name: Publicar APK en Releases (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Remesas · APK Android
          body: |
            Última versión del APK de Remesas.
            Descarga **Remesas.apk** e instálala en tu Android
            (activa "Instalar apps de fuentes desconocidas" si te lo pide).
          files: Remesas.apk
